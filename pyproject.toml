[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-assistant"
version = "0.1.0"
description = "RAG assistant over arXiv explainable-AI papers with page-level citations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "pymupdf>=1.24",
  "rank-bm25>=0.2.2",
  "chromadb>=0.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.35",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Real embedding model (pulls in torch, so it is optional: tests and CI do not need it).
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
